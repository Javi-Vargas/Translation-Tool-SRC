<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTI Translation</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2129;
    --panel-2: #222b35;
    --border: #2e3a47;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #2f81f7;
    --accent-hover: #4793ff;
    --ok: #3fb950;
    --bad: #f85149;
    --warn: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-size: 18px; font-weight: 600; letter-spacing: 0.3px; }
  .brand .sub { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }

  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
  .dot.warn { background: var(--warn); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px;
    gap: 20px;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
  }

  .panels { display: flex; gap: 12px; align-items: stretch; }
  .panel {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 320px;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 14px;
    outline: none;
  }
  textarea {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 16px;
    line-height: 1.5;
    padding: 14px;
    outline: none;
    font-family: inherit;
  }
  textarea[readonly] { color: var(--text); }
  .panel-foot {
    padding: 8px 14px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted); min-height: 34px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .swap-col { display: flex; align-items: center; }
  .swap-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 40px; height: 40px; border-radius: 50%;
    cursor: pointer; font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.15s;
  }
  .swap-btn:hover { background: var(--accent); transform: rotate(180deg); }

  .actions { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .translate-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 40px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px;
    transition: background 0.15s;
  }
  .translate-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .translate-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress { font-size: 13px; color: var(--muted); min-height: 18px; text-align: center; }
  .error {
    display: none;
    background: rgba(248,81,73,0.12);
    border: 1px solid var(--bad);
    color: #ffb4ae;
    padding: 10px 14px; border-radius: 8px; font-size: 14px;
    text-align: center;
  }

  /* CTI score */
  .cti { font-size: 12px; }
  .cti-summary { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .badge { padding: 2px 8px; border-radius: 12px; font-weight: 600; }
  .badge.good { background: rgba(63,185,80,0.15); color: var(--ok); }
  .badge.mid  { background: rgba(210,153,34,0.15); color: var(--warn); }
  .badge.bad  { background: rgba(248,81,73,0.15); color: var(--bad); }
  .toggle { color: var(--accent); cursor: pointer; text-decoration: underline; user-select: none; }
  .breakdown { display: none; margin-top: 8px; width: 100%; }
  .breakdown table { width: 100%; border-collapse: collapse; }
  .breakdown td { padding: 3px 6px; border-bottom: 1px solid var(--border); }
  .pass { color: var(--ok); font-weight: 600; }
  .fail { color: var(--bad); font-weight: 600; }

  @media (max-width: 760px) {
    .panels { flex-direction: column; }
    .swap-col { justify-content: center; }
    .swap-btn:hover { transform: rotate(90deg); }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">CTI Translation<span class="sub">threat intelligence · air-gapped</span></div>
    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Checking backend…</span>
    </div>
  </header>

  <main>
    <div class="panels">
      <!-- Source -->
      <div class="panel">
        <div class="panel-head">
          <select id="sourceLang">
            <option>English</option>
            <option>Traditional Chinese</option>
            <option>Simplified Chinese</option>
          </select>
        </div>
        <textarea id="sourceText" placeholder="Enter text to translate…"></textarea>
        <div class="panel-foot">
          <span id="charCount">0 characters</span>
        </div>
      </div>

      <!-- Swap -->
      <div class="swap-col">
        <button id="swapBtn" class="swap-btn" title="Swap languages and text">⇄</button>
      </div>

      <!-- Target -->
      <div class="panel">
        <div class="panel-head">
          <select id="targetLang">
            <option>Traditional Chinese</option>
            <option>English</option>
            <option>Simplified Chinese</option>
          </select>
        </div>
        <textarea id="targetText" readonly placeholder="Translation will appear here…"></textarea>
        <div class="panel-foot">
          <div id="ctiScore" class="cti"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="translateBtn" class="translate-btn">Translate</button>
      <div id="progress" class="progress"></div>
      <div id="error" class="error"></div>
    </div>
  </main>

<script>
(function () {
  "use strict";

  var LANGS = ["English", "Traditional Chinese", "Simplified Chinese"];

  var sourceLang = document.getElementById("sourceLang");
  var targetLang = document.getElementById("targetLang");
  var sourceText = document.getElementById("sourceText");
  var targetText = document.getElementById("targetText");
  var charCount  = document.getElementById("charCount");
  var translateBtn = document.getElementById("translateBtn");
  var swapBtn = document.getElementById("swapBtn");
  var progress = document.getElementById("progress");
  var errorBox = document.getElementById("error");
  var ctiScore = document.getElementById("ctiScore");
  var statusDot = document.getElementById("statusDot");
  var statusText = document.getElementById("statusText");

  // ---- Character count ----
  function updateCount() {
    var n = sourceText.value.length;
    charCount.textContent = n + (n === 1 ? " character" : " characters");
  }
  sourceText.addEventListener("input", updateCount);
  updateCount();

  // ---- Backend health indicator ----
  function setStatus(cls, text) {
    statusDot.className = "dot " + cls;
    statusText.textContent = text;
  }
  function checkHealth() {
    fetch("/api/health", { method: "GET" })
      .then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, body: j }; });
      })
      .then(function (res) {
        if (res.ok && res.body.status === "ready") {
          setStatus("ok", "Backend ready");
        } else if (res.body && res.body.status === "loading") {
          setStatus("warn", "Backend loading model…");
        } else {
          setStatus("bad", "Backend unavailable");
        }
      })
      .catch(function () {
        setStatus("bad", "Backend unreachable");
      });
  }
  checkHealth();
  setInterval(checkHealth, 15000);

  // ---- Swap ----
  swapBtn.addEventListener("click", function () {
    var sl = sourceLang.value;
    sourceLang.value = targetLang.value;
    targetLang.value = sl;
    var st = sourceText.value;
    sourceText.value = targetText.value;
    targetText.value = st;
    updateCount();
    clearScore();
  });

  // ---- Progress messages ----
  var progressTimer = null;
  function startProgress() {
    var start = Date.now();
    function tick() {
      var s = (Date.now() - start) / 1000;
      if (s < 30) {
        progress.textContent = "Translating…";
      } else if (s < 60) {
        progress.textContent = "Still working — CPU translation may take a few minutes…";
      } else {
        progress.textContent = "Almost there — complex documents can take up to 5 minutes…";
      }
    }
    tick();
    progressTimer = setInterval(tick, 1000);
  }
  function stopProgress() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    progress.textContent = "";
  }

  // ---- Error ----
  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
  }
  function clearError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
  }

  // ---- CTI score rendering ----
  function clearScore() { ctiScore.innerHTML = ""; }

  function renderScore(data) {
    var terms = data.cti_terms || {};
    var total = Object.keys(terms).length;
    var passed = 0;
    for (var k in terms) { if (terms[k] === "PASS") passed++; }

    var rate = data.cti_pass_rate || (passed + "/" + total);
    var ratio = total ? passed / total : 0;
    var badgeCls = ratio >= 0.9 ? "good" : (ratio >= 0.6 ? "mid" : "bad");

    var isChinese = data.target_lang === "Traditional Chinese" ||
                    data.target_lang === "Simplified Chinese";
    var scriptHtml = "";
    if (isChinese) {
      var sc = data.script_check || "";
      if (sc.indexOf("CORRECT") === 0) {
        scriptHtml = '<span class="badge good">Script: Traditional Chinese ✓</span>';
      } else if (sc.indexOf("WRONG") === 0) {
        scriptHtml = '<span class="badge bad">Script: WRONG ✗</span>';
      } else {
        scriptHtml = '<span class="badge mid">Script: ' + escapeHtml(sc) + '</span>';
      }
    }

    var rows = "";
    for (var term in terms) {
      var v = terms[term];
      var cls = v === "PASS" ? "pass" : "fail";
      rows += "<tr><td>" + escapeHtml(term) + '</td><td class="' + cls + '">' + v + "</td></tr>";
    }

    ctiScore.innerHTML =
      '<div class="cti-summary">' +
        '<span class="badge ' + badgeCls + '">CTI Terms: ' + escapeHtml(rate) + '</span>' +
        scriptHtml +
        '<span class="toggle" id="ctiToggle">show breakdown</span>' +
      '</div>' +
      '<div class="breakdown" id="ctiBreakdown"><table>' + rows + '</table></div>';

    var toggle = document.getElementById("ctiToggle");
    var breakdown = document.getElementById("ctiBreakdown");
    toggle.addEventListener("click", function () {
      var open = breakdown.style.display === "block";
      breakdown.style.display = open ? "none" : "block";
      toggle.textContent = open ? "show breakdown" : "hide breakdown";
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ---- Translate ----
  translateBtn.addEventListener("click", function () {
    var text = sourceText.value.trim();
    clearError();
    clearScore();

    if (!text) { showError("Please enter some text to translate."); return; }
    if (sourceLang.value === targetLang.value) {
      showError("Source and target languages must be different.");
      return;
    }

    translateBtn.disabled = true;
    swapBtn.disabled = true;
    translateBtn.innerHTML = '<span class="spinner"></span> Translating…';
    targetText.value = "";
    startProgress();

    fetch("/api/translate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        source_text: sourceText.value,
        source_lang: sourceLang.value,
        target_lang: targetLang.value,
        use_placeholder: true
      })
    })
      .then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
      })
      .then(function (res) {
        if (!res.ok) {
          var detail = (res.body && res.body.detail) ? res.body.detail : ("HTTP " + res.status);
          if (res.status === 503) {
            showError("Backend is still loading the model. Please wait a couple of minutes and retry.");
          } else {
            showError("Translation failed: " + detail);
          }
          return;
        }
        targetText.value = res.body.translation || "";
        renderScore(res.body);
      })
      .catch(function (e) {
        showError("Could not reach the backend. It may be unreachable or the request timed out. (" + e.message + ")");
      })
      .finally(function () {
        stopProgress();
        translateBtn.disabled = false;
        swapBtn.disabled = false;
        translateBtn.textContent = "Translate";
      });
  });
})();
</script>
</body>
</html>
