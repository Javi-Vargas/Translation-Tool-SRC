upstream translation_backends {
    least_conn;
    server BACKEND1_IP:8000 max_fails=3 fail_timeout=30s;
    server BACKEND2_IP:8000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name translate.internal FRONTEND_IP;

    # Serve static UI
    location / {
        root /var/www/cti-translate;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend pool
    location /api/ {
        proxy_pass http://translation_backends/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long timeouts for slow CPU inference
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;

        # Disable buffering for streaming-friendly response
        proxy_buffering off;
    }
}
