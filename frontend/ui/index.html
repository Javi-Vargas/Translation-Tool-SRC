<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTI Translation</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2129;
    --panel-2: #222b35;
    --border: #2e3a47;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #2f81f7;
    --accent-hover: #4793ff;
    --ok: #3fb950;
    --bad: #f85149;
    --warn: #d29922;
  }
  html[data-theme="light"] {
    --bg: #f6f8fa;
    --panel: #ffffff;
    --panel-2: #f0f2f5;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #656d76;
    --accent: #0969da;
    --accent-hover: #0860ca;
    --ok: #1a7f37;
    --bad: #cf222e;
    --warn: #9a6700;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-size: 18px; font-weight: 600; letter-spacing: 0.3px; }
  .brand .sub { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }

  .header-right { display: flex; align-items: center; gap: 16px; }

  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
  .dot.warn { background: var(--warn); }

  .theme-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    width: 32px; height: 32px;
    transition: color 0.15s, background 0.15s;
  }
  .theme-btn:hover { color: var(--text); background: var(--panel-2); }
  .theme-btn svg { width: 18px; height: 18px; display: block; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px;
    gap: 20px;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
  }

  .panels { display: flex; gap: 12px; align-items: stretch; }
  .panel {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 320px;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 14px;
    outline: none;
  }
  textarea {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 16px;
    line-height: 1.5;
    padding: 14px;
    outline: none;
    font-family: inherit;
  }
  textarea[readonly] { color: var(--text); }
  .panel-foot {
    padding: 8px 14px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted); min-height: 34px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .copy-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 3px 7px;
    display: none;
    align-items: center;
    gap: 4px;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    transition: color 0.15s, background 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .copy-btn:hover { color: var(--text); background: var(--panel-2); }
  .copy-btn.copied { color: var(--ok); }
  .copy-btn svg { width: 13px; height: 13px; display: block; }

  .swap-col { display: flex; align-items: center; }
  .swap-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 40px; height: 40px; border-radius: 50%;
    cursor: pointer; font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.15s;
  }
  .swap-btn:hover { background: var(--accent); transform: rotate(180deg); }

  .actions { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .translate-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 40px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px;
    transition: background 0.15s;
  }
  .translate-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .translate-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress { font-size: 13px; color: var(--muted); min-height: 18px; text-align: center; }
  .error {
    display: none;
    background: rgba(248,81,73,0.12);
    border: 1px solid var(--bad);
    color: #ffb4ae;
    padding: 10px 14px; border-radius: 8px; font-size: 14px;
    text-align: center;
  }

  /* CTI score */
  .cti { font-size: 12px; }
  .cti-summary { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .badge { padding: 2px 8px; border-radius: 12px; font-weight: 600; }
  .badge.good { background: rgba(63,185,80,0.15); color: var(--ok); }
  .badge.mid  { background: rgba(210,153,34,0.15); color: var(--warn); }
  .badge.bad  { background: rgba(248,81,73,0.15); color: var(--bad); }
  .toggle { color: var(--accent); cursor: pointer; text-decoration: underline; user-select: none; }
  .breakdown { display: none; margin-top: 8px; width: 100%; }
  .breakdown table { width: 100%; border-collapse: collapse; }
  .breakdown td { padding: 3px 6px; border-bottom: 1px solid var(--border); }
  .pass { color: var(--ok); font-weight: 600; }
  .fail { color: var(--bad); font-weight: 600; }

  @media (max-width: 760px) {
    .panels { flex-direction: column; }
    .swap-col { justify-content: center; }
    .swap-btn:hover { transform: rotate(90deg); }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">CTI Translation<span class="sub">threat intelligence · air-gapped</span></div>
    <div class="header-right">
      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Checking backend…</span>
      </div>
      <button id="themeBtn" class="theme-btn" title="Toggle light/dark mode"></button>
    </div>
  </header>

  <main>
    <div class="panels">
      <!-- Source -->
      <div class="panel">
        <div class="panel-head">
          <select id="sourceLang">
            <option>English</option>
            <option>Traditional Chinese</option>
            <option>Simplified Chinese</option>
          </select>
        </div>
        <textarea id="sourceText" placeholder="Enter text to translate…"></textarea>
        <div class="panel-foot">
          <span id="charCount">0 characters</span>
        </div>
      </div>

      <!-- Swap -->
      <div class="swap-col">
        <button id="swapBtn" class="swap-btn" title="Swap languages and text">⇄</button>
      </div>

      <!-- Target -->
      <div class="panel">
        <div class="panel-head">
          <select id="targetLang">
            <option>Traditional Chinese</option>
            <option>English</option>
            <option>Simplified Chinese</option>
          </select>
        </div>
        <textarea id="targetText" readonly placeholder="Translation will appear here…"></textarea>
        <div class="panel-foot">
          <div id="ctiScore" class="cti"></div>
          <button id="copyBtn" class="copy-btn" title="Copy translation to clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="translateBtn" class="translate-btn">Translate</button>
      <div id="progress" class="progress"></div>
      <div id="error" class="error"></div>
    </div>
  </main>

<script>
(function () {
  "use strict";

  var LANGS = ["English", "Traditional Chinese", "Simplified Chinese"];

  var sourceLang  = document.getElementById("sourceLang");
  var targetLang  = document.getElementById("targetLang");
  var sourceText  = document.getElementById("sourceText");
  var targetText  = document.getElementById("targetText");
  var charCount   = document.getElementById("charCount");
  var translateBtn = document.getElementById("translateBtn");
  var swapBtn     = document.getElementById("swapBtn");
  var progress    = document.getElementById("progress");
  var errorBox    = document.getElementById("error");
  var ctiScore    = document.getElementById("ctiScore");
  var statusDot   = document.getElementById("statusDot");
  var statusText  = document.getElementById("statusText");
  var themeBtn    = document.getElementById("themeBtn");
  var copyBtn     = document.getElementById("copyBtn");

  // ---- Theme toggle ----
  var SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  var MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeBtn.innerHTML = theme === "light" ? MOON_SVG : SUN_SVG;
    try { localStorage.setItem("cti-theme", theme); } catch (e) {}
  }

  var savedTheme = "dark";
  try { savedTheme = localStorage.getItem("cti-theme") || "dark"; } catch (e) {}
  applyTheme(savedTheme);

  themeBtn.addEventListener("click", function () {
    var current = document.documentElement.getAttribute("data-theme");
    applyTheme(current === "light" ? "dark" : "light");
  });

  // ---- Copy to clipboard ----
  var COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var copyTimer = null;

  copyBtn.addEventListener("click", function () {
    var text = targetText.value;
    if (!text) return;

    function onCopied() {
      copyBtn.classList.add("copied");
      copyBtn.innerHTML = CHECK_SVG + " Copied!";
      if (copyTimer) clearTimeout(copyTimer);
      copyTimer = setTimeout(function () {
        copyBtn.classList.remove("copied");
        copyBtn.innerHTML = COPY_SVG + " Copy";
      }, 2000);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onCopied).catch(function () {});
    } else {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.cssText = "position:fixed;opacity:0;pointer-events:none";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        onCopied();
      } catch (e) {}
    }
  });

  function showCopyBtn() { copyBtn.style.display = "flex"; }
  function hideCopyBtn() {
    copyBtn.style.display = "none";
    copyBtn.classList.remove("copied");
    copyBtn.innerHTML = COPY_SVG + " Copy";
    if (copyTimer) { clearTimeout(copyTimer); copyTimer = null; }
  }

  // ---- Character count ----
  function updateCount() {
    var n = sourceText.value.length;
    charCount.textContent = n + (n === 1 ? " character" : " characters");
  }
  sourceText.addEventListener("input", updateCount);
  updateCount();

  // ---- Backend health indicator ----
  function setStatus(cls, text) {
    statusDot.className = "dot " + cls;
    statusText.textContent = text;
  }
  function checkHealth() {
    fetch("/api/health", { method: "GET" })
      .then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, body: j }; });
      })
      .then(function (res) {
        if (res.ok && res.body.status === "ready") {
          setStatus("ok", "Backend ready");
        } else if (res.body && res.body.status === "loading") {
          setStatus("warn", "Backend loading model…");
        } else {
          setStatus("bad", "Backend unavailable");
        }
      })
      .catch(function () {
        setStatus("bad", "Backend unreachable");
      });
  }
  checkHealth();
  setInterval(checkHealth, 15000);

  // ---- Swap ----
  swapBtn.addEventListener("click", function () {
    var sl = sourceLang.value;
    sourceLang.value = targetLang.value;
    targetLang.value = sl;
    var st = sourceText.value;
    sourceText.value = targetText.value;
    targetText.value = st;
    updateCount();
    clearScore();
    hideCopyBtn();
  });

  // ---- Progress messages ----
  var progressTimer = null;
  function startProgress() {
    var start = Date.now();
    function tick() {
      var s = (Date.now() - start) / 1000;
      if (s < 30) {
        progress.textContent = "Translating…";
      } else if (s < 60) {
        progress.textContent = "Still working — CPU translation may take a few minutes…";
      } else {
        progress.textContent = "Almost there — complex documents can take up to 5 minutes…";
      }
    }
    tick();
    progressTimer = setInterval(tick, 1000);
  }
  function stopProgress() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    progress.textContent = "";
  }

  // ---- Error ----
  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
  }
  function clearError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
  }

  // ---- CTI score rendering ----
  function clearScore() { ctiScore.innerHTML = ""; }

  function renderScore(data) {
    var terms = data.cti_terms || {};
    var total = Object.keys(terms).length;
    var passed = 0;
    for (var k in terms) { if (terms[k] === "PASS") passed++; }

    var rate = data.cti_pass_rate || (passed + "/" + total);
    var ratio = total ? passed / total : 0;
    var badgeCls = ratio >= 0.9 ? "good" : (ratio >= 0.6 ? "mid" : "bad");

    var isChinese = data.target_lang === "Traditional Chinese" ||
                    data.target_lang === "Simplified Chinese";
    var scriptHtml = "";
    if (isChinese) {
      var sc = data.script_check || "";
      if (sc.indexOf("CORRECT") === 0) {
        scriptHtml = '<span class="badge good">Script: Traditional Chinese ✓</span>';
      } else if (sc.indexOf("WRONG") === 0) {
        scriptHtml = '<span class="badge bad">Script: WRONG ✗</span>';
      } else {
        scriptHtml = '<span class="badge mid">Script: ' + escapeHtml(sc) + '</span>';
      }
    }

    var rows = "";
    for (var term in terms) {
      var v = terms[term];
      var cls = v === "PASS" ? "pass" : "fail";
      rows += "<tr><td>" + escapeHtml(term) + '</td><td class="' + cls + '">' + v + "</td></tr>";
    }

    ctiScore.innerHTML =
      '<div class="cti-summary">' +
        '<span class="badge ' + badgeCls + '">CTI Terms: ' + escapeHtml(rate) + '</span>' +
        scriptHtml +
        '<span class="toggle" id="ctiToggle">show breakdown</span>' +
      '</div>' +
      '<div class="breakdown" id="ctiBreakdown"><table>' + rows + '</table></div>';

    var toggle = document.getElementById("ctiToggle");
    var breakdown = document.getElementById("ctiBreakdown");
    toggle.addEventListener("click", function () {
      var open = breakdown.style.display === "block";
      breakdown.style.display = open ? "none" : "block";
      toggle.textContent = open ? "show breakdown" : "hide breakdown";
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ---- Translate ----
  translateBtn.addEventListener("click", function () {
    var text = sourceText.value.trim();
    clearError();
    clearScore();
    hideCopyBtn();

    if (!text) { showError("Please enter some text to translate."); return; }
    if (sourceLang.value === targetLang.value) {
      showError("Source and target languages must be different.");
      return;
    }

    translateBtn.disabled = true;
    swapBtn.disabled = true;
    translateBtn.innerHTML = '<span class="spinner"></span> Translating…';
    targetText.value = "";
    startProgress();

    fetch("/api/translate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        source_text: sourceText.value,
        source_lang: sourceLang.value,
        target_lang: targetLang.value,
        use_placeholder: true
      })
    })
      .then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
      })
      .then(function (res) {
        if (!res.ok) {
          var detail = (res.body && res.body.detail) ? res.body.detail : ("HTTP " + res.status);
          if (res.status === 503) {
            showError("Backend is still loading the model. Please wait a couple of minutes and retry.");
          } else {
            showError("Translation failed: " + detail);
          }
          return;
        }
        targetText.value = res.body.translation || "";
        renderScore(res.body);
        if (res.body.translation) showCopyBtn();
      })
      .catch(function (e) {
        showError("Could not reach the backend. It may be unreachable or the request timed out. (" + e.message + ")");
      })
      .finally(function () {
        stopProgress();
        translateBtn.disabled = false;
        swapBtn.disabled = false;
        translateBtn.textContent = "Translate";
      });
  });
})();
</script>
</body>
</html>
